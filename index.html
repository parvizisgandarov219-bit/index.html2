async function storageGet(key) {
  try {
    const val = localStorage.getItem(key);
    if (val !== null) return { value: val };
    return null;
  } catch(e) { return null; }
}
async function storageSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return { key, value };
  } catch(e) { return null; }
}

// Helper: resolve timeSlots based on shift
function resolveSheet(base, shift) {
  const slots = shift === "Night" ? base.nightSlots : base.daySlots;
  return { ...base, timeSlots: slots };
}

// ===================== HELPER: Parse ranges =====================
function getParams(sheet) {
  if (sheet.sections) return sheet.sections.flatMap(s => s.parameters);
  return sheet.parameters || [];
}

function isOutOfRange(val, param) {
  if (val === "" || val === null || val === undefined) return false;
  const num = parseFloat(val);
  if (isNaN(num)) return false;
  if (param.min != null && num < param.min) return true;
  if (param.max != null && num > param.max) return true;
  return false;
}

function rangeStr(p) {
  if (p.range) return p.range;
  if (p.min != null && p.max != null) {
    if (p.max === 99999) return `min ${p.min}`;
    return `${p.min} - ${p.max}`;
  }
  if (p.min != null) return `min ${p.min}`;
  if (p.max != null) return `max ${p.max}`;
  return "-";
}

// Check if a time slot column has any data filled for any parameter
function isSlotFilled(params, slot, values) {
  // ALL parameters must have data for this slot
  return params.every(p => {
    const key = `${p.tag}__${slot}`;
    return values[key] && values[key].toString().trim() !== "";
  });
}

// Check if the previous hour slot is filled (at least one parameter)
function canEditSlot(params, slotIndex, timeSlots, values) {
  if (slotIndex === 0) return true;
  const prevSlot = timeSlots[slotIndex - 1];
  return isSlotFilled(params, prevSlot, values);
}

      setSections(s.sections.map(sec=>({name:sec.name,parameters:sec.parameters.map(p=>({...p}))})));
      setParamRows([]);
    } else {
      setUseSections(false);
      setSections([]);
      setParamRows((s.parameters||[]).map(p=>({...p})));
    }
    setEditingIdx(idx);
    setShowAdd(false);

    if (editingIdx !== null) {

          <tr>
            <th style={{...S.th,minWidth:80}}>Tag</th>
            <th style={{...S.th,minWidth:140}}>Description</th>
            <th style={{...S.th,minWidth:50}}>Unit</th>
            {showRange && <th style={{...S.th,minWidth:50}}>Min</th>}
            {showRange && <th style={{...S.th,minWidth:50}}>Max</th>}
            <th style={{...S.th,width:40}}></th>
          </tr>
        </thead>
        <tbody>
          {rows.map((p,i)=>(
            <tr key={i}>
              <td style={S.td}><input style={{...S.input,padding:"4px 6px",fontSize:11}} value={p.tag} onChange={e=>onUpdate(i,"tag",e.target.value)} placeholder="TAG-001" /></td>
              <td style={S.td}><input style={{...S.input,padding:"4px 6px",fontSize:11}} value={p.desc} onChange={e=>onUpdate(i,"desc",e.target.value)} placeholder="Description" /></td>
              <td style={S.td}><input style={{...S.input,padding:"4px 6px",fontSize:11,width:60}} value={p.unit} onChange={e=>onUpdate(i,"unit",e.target.value)} placeholder="°C" /></td>
              {showRange && <td style={S.td}><input style={{...S.input,padding:"4px 6px",fontSize:11,width:60}} value={p.min==null?"":p.min} onChange={e=>onUpdate(i,"min",e.target.value===""?null:parseFloat(e.target.value)||0)} placeholder="-" /></td>}
              {showRange && <td style={S.td}><input style={{...S.input,padding:"4px 6px",fontSize:11,width:60}} value={p.max==null?"":p.max} onChange={e=>onUpdate(i,"max",e.target.value===""?null:parseFloat(e.target.value)||0)} placeholder="-" /></td>}
              <td style={S.td}><button style={S.btn(COLORS.danger,true)} onClick={()=>onRemove(i)}>✕</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <button style={{...S.btn(COLORS.primary,true),marginTop:8}} onClick={onAdd}>+ Add Parameter</button>
    </div>
  );

  return (
    <div style={{...S.card,marginTop:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontSize:15,fontWeight:700,color:COLORS.white}}>Log Sheet Management ({sheets.length} sheets)</div>
        {!isEditing && <button style={S.btn(COLORS.success,true)} onClick={startAdd}>+ Add New Sheet</button>}
      </div>

      {/* Sheet list */}
      {!isEditing && sheets.map((s,idx) => (
        <div key={idx} style={{padding:12,borderBottom:`1px solid ${COLORS.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14,color:COLORS.white}}>{s.name}</div>
            <div style={{fontSize:11,color:COLORS.textDim}}>
              Site: {s.site} | Type: {s.type} | Day: {s.daySlots.length} slots | Night: {s.nightSlots.length} slots | Params: {getParams(s).length}
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button style={S.btn(COLORS.primary,true)} onClick={()=>startEdit(idx)}>Edit</button>
            {confirmDelete===idx ? (
              <div style={{display:"flex",gap:4,alignItems:"center"}}>
                <span style={{fontSize:11,color:COLORS.danger}}>Confirm?</span>
                <button style={S.btn(COLORS.danger,true)} onClick={()=>deleteSheet(idx)}>Yes</button>
                <button style={S.btn(COLORS.textMuted,true)} onClick={()=>setConfirmDelete(null)}>No</button>
              </div>
            ) : (
              <button style={S.btn(COLORS.danger,true)} onClick={()=>setConfirmDelete(idx)}>Delete</button>
            )}
          </div>
        </div>
      ))}

      {/* Add / Edit form */}
      {isEditing && (
        <div style={{border:`1px solid ${COLORS.primary}`,borderRadius:10,padding:20,marginTop:12,background:"rgba(59,130,246,0.04)"}}>
          <div style={{fontSize:14,fontWeight:700,color:COLORS.white,marginBottom:16}}>{editingIdx!==null?"Edit Log Sheet":"Add New Log Sheet"}</div>

          {/* Basic info */}
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:180}}><label style={S.label}>Sheet Name</label><input style={S.input} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. PP Polymerization DCS" /></div>
            <div style={{flex:1,minWidth:140}}><label style={S.label}>Site</label><input style={S.input} value={form.site} onChange={e=>setForm({...form,site:e.target.value})} placeholder="e.g. PP Polymerization" /></div>
            <div style={{flex:"0 0 120px"}}><label style={S.label}>Type</label>
              <select style={S.input} value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                <option>DCS</option><option>Field</option>
              </select>
            </div>
          </div>

          {/* Time slots */}
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:200}}><label style={S.label}>Day Shift Time Slots (comma-separated)</label><input style={S.input} value={daySlotsStr} onChange={e=>setDaySlotsStr(e.target.value)} placeholder="08:00, 09:00, 10:00, ..." /></div>
            <div style={{flex:1,minWidth:200}}><label style={S.label}>Night Shift Time Slots (comma-separated)</label><input style={S.input} value={nightSlotsStr} onChange={e=>setNightSlotsStr(e.target.value)} placeholder="20:00, 21:00, 22:00, ..." /></div>
          </div>

          {/* Header fields */}
          <div style={{marginBottom:14}}>
            <label style={S.label}>Header Fields (optional)</label>
            {headerRows.map((h,i)=>(
              <div key={i} style={{display:"flex",gap:6,marginBottom:4}}>
                <input style={{...S.input,flex:1}} value={h.key} onChange={e=>updateHeader(i,"key",e.target.value)} placeholder="key (e.g. ppGrade)" />
                <input style={{...S.input,flex:1}} value={h.label} onChange={e=>updateHeader(i,"label",e.target.value)} placeholder="Label (e.g. PP Grade)" />
                <button style={S.btn(COLORS.danger,true)} onClick={()=>removeHeader(i)}>✕</button>
              </div>
            ))}
            <button style={{...S.btn(COLORS.textMuted,true),marginTop:4}} onClick={addHeaderRow}>+ Add Header Field</button>
          </div>

          {/* Section toggle */}
          <div style={{marginBottom:14}}>
            <label style={{...S.label,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
              <input type="checkbox" checked={useSections} onChange={e=>{
                setUseSections(e.target.checked);
                if (e.target.checked && sections.length===0) addSection();
                if (!e.target.checked && paramRows.length===0) addParamRow();
              }} />
              Use Sections (group parameters by area)
            </label>
          </div>

          {/* Parameters (flat) */}
          {!useSections && (
            <div style={{marginBottom:14}}>
              <label style={S.label}>Parameters</label>
              <ParamTable rows={paramRows} onUpdate={updateParam} onRemove={removeParam} onAdd={addParamRow} showRange={form.type==="Field"} />
            </div>
          )}

          {/* Parameters (sectioned) */}
          {useSections && (
            <div style={{marginBottom:14}}>
              <label style={S.label}>Sections & Parameters</label>
              {sections.map((sec,si)=>(
                <div key={si} style={{border:`1px solid ${COLORS.border}`,borderRadius:8,padding:12,marginBottom:10,background:COLORS.sectionBg}}>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                    <input style={{...S.input,flex:1,fontWeight:600}} value={sec.name} onChange={e=>updateSectionName(si,e.target.value)} placeholder="Section name (e.g. Area 2100)" />
                    <button style={S.btn(COLORS.danger,true)} onClick={()=>removeSection(si)}>Remove Section</button>
                  </div>
                  <ParamTable
                    rows={sec.parameters}
                    onUpdate={(pi,field,val)=>updateSectionParam(si,pi,field,val)}
                    onRemove={(pi)=>removeSectionParam(si,pi)}
                    onAdd={()=>addSectionParam(si)}
                    showRange={form.type==="Field"}
                  />
                </div>
              ))}
              <button style={{...S.btn(COLORS.primary,true),marginTop:4}} onClick={addSection}>+ Add Section</button>
            </div>
          )}

          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button style={S.btn(COLORS.success)} onClick={saveSheet}>{editingIdx!==null?"Save Changes":"Add Sheet"}</button>
            <button style={S.btnOutline} onClick={()=>{setShowAdd(false);setEditingIdx(null);}}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ===================== COMPONENT: ADMIN PANEL (FULL CONTROL) =====================
function AdminPanel({ badges, setBadges, savedEntries, setSavedEntries, sheets, setSheets, onBack }) {
  const [tab, setTab] = useState("badges");
  const [newId, setNewId] = useState("");
  const [newName, setNewName] = useState("");
  const [newPlant, setNewPlant] = useState("PP");
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editPlant, setEditPlant] = useState("PP");
  const [searchBadge, setSearchBadge] = useState("");
  const [badgeSaved, setBadgeSaved] = useState(false);
  const [selectedEntry, setSelectedEntry] = useState(null);
  const [editingEntry, setEditingEntry] = useState(null);
  const [entrySearch, setEntrySearch] = useState("");
  const [entrySiteFilter, setEntrySiteFilter] = useState("All");
  const [entryShiftFilter, setEntryShiftFilter] = useState("All");

  const filteredBadges = badges.filter(b =>
    b.id.includes(searchBadge) || b.name.toLowerCase().includes(searchBadge.toLowerCase())
  );

  const filteredEntries = savedEntries.filter(e => {
    if (entrySiteFilter !== "All" && e.site !== entrySiteFilter) return false;
    if (entryShiftFilter !== "All" && e.shift !== entryShiftFilter) return false;
    if (entrySearch && !(
      e.sheetName.toLowerCase().includes(entrySearch.toLowerCase()) ||
      e.operator.toLowerCase().includes(entrySearch.toLowerCase()) ||
      e.date.includes(entrySearch)
    )) return false;
    return true;
  });

  const sites = [...new Set(savedEntries.map(e => e.site))];

  // Admin inline editor for entry values
  const AdminEntryEditor = ({ entry, entryIndex }) => {
    const sheetBase = sheets.find(s => s.name === entry.sheetName);
    if (!sheetBase) return <div style={{color:COLORS.textDim,padding:20}}>Sheet definition not found.</div>;
    const sheet = resolveSheet(sheetBase, entry.shift);
    const params = getParams(sheet);
    const [localValues, setLocalValues] = useState({...entry.values});
    const [localNotes, setLocalNotes] = useState({...entry.notes});
    const [localFinalNotes, setLocalFinalNotes] = useState(entry.finalNotes || "");
    const [localHeaderValues, setLocalHeaderValues] = useState({...entry.headerValues});
    const [localShift, setLocalShift] = useState(entry.shift);
    const [localDate, setLocalDate] = useState(entry.date);
    const [saved, setSaved] = useState(false);

    const currentSheet = resolveSheet(sheetBase, localShift);

    const handleAdminSave = () => {
      const updatedEntry = {
        ...entry,
        values: localValues,
        notes: localNotes,
        finalNotes: localFinalNotes,
        headerValues: localHeaderValues,
        shift: localShift,
        date: localDate,
        timeSlots: currentSheet.timeSlots,
        lastModifiedBy: "Admin",
        lastModifiedAt: new Date().toISOString(),
      };
      const newEntries = [...savedEntries];
      newEntries[entryIndex] = updatedEntry;
      setSavedEntries(newEntries);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    };

    return (
      <div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:16,alignItems:"flex-end"}}>
          <div style={{flex:"0 0 160px"}}><label style={S.label}>Date</label><input type="date" style={S.input} value={localDate} onChange={e=>setLocalDate(e.target.value)} /></div>
          <div style={{flex:"0 0 120px"}}><label style={S.label}>Shift</label>
            <select style={S.input} value={localShift} onChange={e=>setLocalShift(e.target.value)}>
              <option>Day</option><option>Night</option>
            </select>
          </div>
          {(sheetBase.headerFields||[]).map(hf => (
            <div key={hf.key} style={{flex:1,minWidth:140}}>
              <label style={S.label}>{hf.label}</label>
              <input style={S.input} value={localHeaderValues[hf.key]||""} onChange={e=>setLocalHeaderValues({...localHeaderValues,[hf.key]:e.target.value})} />
            </div>
          ))}
        </div>

        <div style={{overflowX:"auto",marginBottom:16}}>
          <table style={S.table}>
            <thead>
              <tr>
                <th style={{...S.th,minWidth:60}}>Tag</th>
                <th style={{...S.th,minWidth:140}}>Description</th>
                <th style={{...S.th,minWidth:40}}>Unit</th>
                <th style={{...S.th,minWidth:60}}>Range</th>
                {currentSheet.timeSlots.map(t=><th key={t} style={{...S.th,minWidth:80,textAlign:"center"}}>{t}</th>)}
              </tr>
            </thead>
            <tbody>
              {currentSheet.sections ? currentSheet.sections.map(sec => (
                <Fragment key={sec.name}>
                  <tr><td colSpan={4+currentSheet.timeSlots.length} style={{...S.sectionHeader,border:"none"}}>{sec.name}</td></tr>
                  {sec.parameters.map(p => (
                    <tr key={p.tag}>
                      <td style={{...S.td,fontWeight:600,fontSize:11,color:COLORS.primary,fontFamily:"monospace"}}>{p.tag}</td>
                      <td style={{...S.td,fontSize:11}}>{p.desc}</td>
                      <td style={{...S.td,fontSize:11,color:COLORS.textDim}}>{p.unit}</td>
                      <td style={{...S.td,fontSize:11,color:COLORS.textDim,whiteSpace:"nowrap"}}>{rangeStr(p)}</td>
                      {currentSheet.timeSlots.map(slot => {
                        const key = `${p.tag}__${slot}`;
                        const val = localValues[key] || "";
                        const oor = isOutOfRange(val, p);
                        return (
                          <td key={slot} style={{...S.td,padding:"3px 2px"}}>
                            <input
                              style={{...S.input,padding:"5px 6px",fontSize:12,textAlign:"center",width:72,...(oor?S.inputDanger:{})}}
                              value={val}
                              onChange={e=>setLocalValues({...localValues,[key]:e.target.value})}
                              placeholder="-"
                            />
                            {oor && (
                              <textarea
                                style={{...S.input,fontSize:9,padding:3,marginTop:2,minHeight:28,resize:"vertical",width:72,borderColor:COLORS.warning}}
                                value={localNotes[key]||""}
                                onChange={e=>setLocalNotes({...localNotes,[key]:e.target.value})}
                                placeholder="Note..."
                              />
                            )}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </Fragment>
              )) : params.map(p => (
                <tr key={p.tag}>
                  <td style={{...S.td,fontWeight:600,fontSize:11,color:COLORS.primary,fontFamily:"monospace"}}>{p.tag}</td>
                  <td style={{...S.td,fontSize:11}}>{p.desc}</td>
                  <td style={{...S.td,fontSize:11,color:COLORS.textDim}}>{p.unit}</td>
                  <td style={{...S.td,fontSize:11,color:COLORS.textDim,whiteSpace:"nowrap"}}>{rangeStr(p)}</td>
                  {currentSheet.timeSlots.map(slot => {
                    const key = `${p.tag}__${slot}`;
                    const val = localValues[key] || "";
                    const oor = isOutOfRange(val, p);
                    return (
                      <td key={slot} style={{...S.td,padding:"3px 2px"}}>
                        <input
                          style={{...S.input,padding:"5px 6px",fontSize:12,textAlign:"center",width:72,...(oor?S.inputDanger:{})}}
                          value={val}
                          onChange={e=>setLocalValues({...localValues,[key]:e.target.value})}
                          placeholder="-"
                        />
                        {oor && (
                          <textarea
                            style={{...S.input,fontSize:9,padding:3,marginTop:2,minHeight:28,resize:"vertical",width:72,borderColor:COLORS.warning}}
                            value={localNotes[key]||""}
                            onChange={e=>setLocalNotes({...localNotes,[key]:e.target.value})}
                            placeholder="Note..."
                          />
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Admin final notes editing */}
        <div style={{...S.card,marginBottom:16}}>
          <label style={S.label}>Final Notes / General Comments</label>
          <textarea
            style={{...S.input,minHeight:80,resize:"vertical"}}
            value={localFinalNotes}
            onChange={e=>setLocalFinalNotes(e.target.value)}
            placeholder="Admin can edit final notes here..."
          />
        </div>

        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <button style={{...S.btn(COLORS.success),padding:"12px 28px"}} onClick={handleAdminSave}>Save Changes</button>
          <button style={S.btnOutline} onClick={()=>setEditingEntry(null)}>Cancel</button>
          {saved && <span style={{color:COLORS.success,fontSize:13,fontWeight:600}}>Changes saved.</span>}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{...S.header}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button style={S.btnOutline} onClick={onBack}>← Back</button>
          <span style={S.logo}>Admin Panel</span>
          <span style={{...S.logoBadge,background:COLORS.danger}}>ADMIN</span>
        </div>
      </div>
      <div style={{padding:20,maxWidth:1200,margin:"0 auto"}}>
        <div style={S.tabs}>
          <button style={S.tab(tab==="badges")} onClick={()=>setTab("badges")}>Badge Management</button>
          <button style={S.tab(tab==="entries")} onClick={()=>setTab("entries")}>All Log Entries</button>
          <button style={S.tab(tab==="sheets")} onClick={()=>setTab("sheets")}>Log Sheets</button>
        </div>

        {/* BADGE MANAGEMENT */}
        {tab === "badges" && (
          <div style={{...S.card,marginTop:16}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:16,color:COLORS.white}}>Add New Badge</div>
            <div style={{display:"flex",gap:10,marginBottom:20}}>
              <input style={{...S.input,flex:"0 0 100px"}} placeholder="Badge #" value={newId} onChange={e=>setNewId(e.target.value.replace(/\D/g,""))} />
              <input style={{...S.input,flex:1}} placeholder="Full Name" value={newName} onChange={e=>setNewName(e.target.value)} />
              <select style={{...S.input,flex:"0 0 90px"}} value={newPlant} onChange={e=>setNewPlant(e.target.value)}>
                <option value="PP">PP</option><option value="HDPE">HDPE</option>
              </select>
              <button style={S.btn(COLORS.success,true)} onClick={()=>{
                if(newId && newName && !badges.find(b=>b.id===newId)){
                  setBadges([...badges,{id:newId,name:newName,plant:newPlant}]);
                  setNewId("");setNewName("");
                }
              }}>Add</button>
            </div>
            <input style={{...S.input,marginBottom:12}} placeholder="Search badges..." value={searchBadge} onChange={e=>setSearchBadge(e.target.value)} />
            <div style={{maxHeight:400,overflowY:"auto"}}>
              <table style={S.table}>
                <thead><tr><th style={S.th}>Badge #</th><th style={S.th}>Name</th><th style={S.th}>Plant</th><th style={S.th}>Actions</th></tr></thead>
                <tbody>
                  {filteredBadges.map(b => (
                    <tr key={b.id}>
                      <td style={S.td}>{b.id}</td>
                      <td style={S.td}>
                        {editId===b.id ? (
                          <input style={{...S.input,padding:"4px 8px"}} value={editName} onChange={e=>setEditName(e.target.value)} />
                        ) : b.name}
                      </td>
                      <td style={S.td}>
                        {editId===b.id ? (
                          <select style={{...S.input,padding:"4px 8px",width:80}} value={editPlant} onChange={e=>setEditPlant(e.target.value)}>
                            <option value="PP">PP</option><option value="HDPE">HDPE</option>
                          </select>
                        ) : <span style={S.chip(b.plant==="HDPE"?"green":"yellow")}>{b.plant||"PP"}</span>}
                      </td>
                      <td style={S.td}>
                        {editId===b.id ? (
                          <div style={{display:"flex",gap:4}}>
                            <button style={S.btn(COLORS.success,true)} onClick={()=>{
                              setBadges(badges.map(x=>x.id===b.id?{...x,name:editName,plant:editPlant}:x));
                              setEditId(null);
                            }}>Save</button>
                            <button style={S.btn(COLORS.textMuted,true)} onClick={()=>setEditId(null)}>Cancel</button>
                          </div>
                        ) : (
                          <div style={{display:"flex",gap:4}}>
                            <button style={S.btn(COLORS.primary,true)} onClick={()=>{setEditId(b.id);setEditName(b.name);setEditPlant(b.plant||"PP");}}>Edit</button>
                            <button style={S.btn(COLORS.danger,true)} onClick={()=>setBadges(badges.filter(x=>x.id!==b.id))}>Delete</button>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{fontSize:12,color:COLORS.textDim,marginTop:10}}>Total: {badges.length} badges</div>
            <div style={{display:"flex",gap:10,alignItems:"center",marginTop:12}}>
              <button style={{...S.btn(COLORS.success),padding:"10px 24px",fontSize:13}} onClick={async ()=>{
                try {
                  await storageSet("socar-badges", JSON.stringify(badges));
                  setBadgeSaved(true);
                  setTimeout(()=>setBadgeSaved(false),3000);
                } catch(e) {}
              }}>💾 Save Badges to All Devices</button>
              {badgeSaved && <span style={{...S.chip("green"),padding:"6px 12px",fontSize:12}}>✓ Badges saved & synced across all devices!</span>}
            </div>
          </div>
        )}

        {/* ALL LOG ENTRIES (admin full visibility & edit) */}
        {tab === "entries" && (
          <div style={{...S.card,marginTop:16}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:16,color:COLORS.white}}>
              All Saved Log Entries ({savedEntries.length})
            </div>

            {/* Filters */}
            <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
              <input style={{...S.input,maxWidth:220}} placeholder="Search by name, sheet, date..." value={entrySearch} onChange={e=>setEntrySearch(e.target.value)} />
              <select style={{...S.input,maxWidth:140}} value={entrySiteFilter} onChange={e=>setEntrySiteFilter(e.target.value)}>
                <option value="All">All Sites</option>
                {sites.map(s=><option key={s}>{s}</option>)}
              </select>
              <select style={{...S.input,maxWidth:120}} value={entryShiftFilter} onChange={e=>setEntryShiftFilter(e.target.value)}>
                <option value="All">All Shifts</option>
                <option>Day</option>
                <option>Night</option>
              </select>
            </div>

            {editingEntry !== null ? (
              <div>
                <div style={{fontSize:14,fontWeight:700,color:COLORS.warning,marginBottom:12}}>
                  Editing: {savedEntries[editingEntry]?.sheetName} — {savedEntries[editingEntry]?.operator} — {savedEntries[editingEntry]?.date}
                </div>
                <AdminEntryEditor entry={savedEntries[editingEntry]} entryIndex={editingEntry} />
              </div>
            ) : (
              <div style={{maxHeight:600,overflowY:"auto"}}>
                {filteredEntries.length === 0 ? (
                  <div style={{textAlign:"center",padding:40,color:COLORS.textDim}}>No entries match filters</div>
                ) : filteredEntries.map((entry, fi) => {
                  const realIndex = savedEntries.indexOf(entry);
                  return (
                    <div key={realIndex} style={{padding:12,borderBottom:`1px solid ${COLORS.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:600,fontSize:13,color:COLORS.white}}>{entry.sheetName}</div>
                        <div style={{fontSize:11,color:COLORS.textDim}}>
                          {entry.operator} ({entry.operatorId}) | {entry.date} | {entry.shift} shift | {entry.type}
                        </div>
                        {entry.lastModifiedBy && <div style={{fontSize:10,color:COLORS.warning}}>Last modified by {entry.lastModifiedBy} at {new Date(entry.lastModifiedAt).toLocaleString()}</div>}
                        {entry.finalNotes && <div style={{fontSize:10,color:COLORS.textDim,marginTop:2}}>Notes: {entry.finalNotes.substring(0,80)}{entry.finalNotes.length>80?"...":""}</div>}
                      </div>
                      <div style={{display:"flex",gap:4}}>
                        <button style={S.btn(COLORS.primary,true)} onClick={()=>setEditingEntry(realIndex)}>Edit</button>
                        <button style={S.btn(COLORS.danger,true)} onClick={()=>{
                          if(confirm("Delete this entry?")) setSavedEntries(savedEntries.filter((_,j)=>j!==realIndex));
                        }}>Delete</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* LOG SHEETS OVERVIEW */}
        {tab === "sheets" && (
          <AdminSheetsManager sheets={sheets} setSheets={setSheets} />
        )}
      </div>
    </div>
  );
}

// ===================== COMPONENT: LOG SHEET FORM =====================
function LogSheetForm({ sheetBase, operator, onSave, onBack, isAdmin, savedEntries }) {
  const params = getParams(sheetBase);
  const [values, setValues] = useState({});
  const [valueMeta, setValueMeta] = useState({}); // {key: {by, at}}
  const [notes, setNotes] = useState({});
  const [headerValues, setHeaderValues] = useState({});
  const [finalNotes, setFinalNotes] = useState("");

  const [shift, setShift] = useState("Day");
  const [date, setDate] = useState(new Date().toISOString().split("T")[0]);
  const [saveError, setSaveError] = useState("");
  const [saved, setSaved] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [wasReset, setWasReset] = useState(false);
  const [loadedFrom, setLoadedFrom] = useState(null); // tracks which existing entry was loaded
  const tableRef = useRef(null);

  // Resolve the current sheet with correct time slots based on shift
  const sheet = resolveSheet(sheetBase, shift);

  // Load existing entry when sheet/date/shift match (skip if form was just reset)
  useEffect(() => {
    if (!savedEntries || wasReset) return;
    const existing = savedEntries.find(e =>
      e.sheetName === sheetBase.name && e.date === date && e.shift === shift
    );
    if (existing) {
      setValues({...existing.values});
      setValueMeta({...existing.valueMeta} || {});
      setNotes({...existing.notes});
      setHeaderValues({...existing.headerValues} || {});
      setFinalNotes(existing.finalNotes || "");
      setLoadedFrom(existing.savedAt);
      setSaved(false);
    } else {
      setValues({});
      setValueMeta({});
      setNotes({});
      setHeaderValues({});
      setFinalNotes("");
      setLoadedFrom(null);
      setSaved(false);
    }
    setSaveError("");
    setWasReset(false);
  }, [date, shift, sheetBase.name]);



  const setVal = (tag, slot, v) => {
    const key = `${tag}__${slot}`;
    setValues(prev => ({...prev, [key]: v}));
    if (v && v.toString().trim() !== "") {
      setValueMeta(prev => ({...prev, [key]: {by: operator.name, at: new Date().toISOString()}}));
    }
    setSaved(false);
  };
  const setNote = (tag, slot, v) => {
    setNotes(prev => ({...prev, [`${tag}__${slot}`]: v}));
  };

  const outOfRangeKeys = [];
  params.forEach(p => {
    sheet.timeSlots.forEach(slot => {
      const key = `${p.tag}__${slot}`;
      if (isOutOfRange(values[key], p)) outOfRangeKeys.push(key);
    });
  });

  const missingNotes = outOfRangeKeys.filter(k => !notes[k] || notes[k].trim() === "");

  const handleSave = () => {
    if (missingNotes.length > 0) {
      setSaveError(`${missingNotes.length} out-of-range value(s) require notes before saving.`);
      return;
    }
    setSaveError("");
    onSave({
      sheetName: sheet.name,
      site: sheet.site,
      type: sheet.type,
      operator: operator.name,
      operatorId: operator.id,
      date,
      shift,
      values: {...values},
      valueMeta: {...valueMeta},
      notes: {...notes},
      finalNotes: finalNotes,
      headerValues: {...headerValues},
      timeSlots: [...sheet.timeSlots],
      savedAt: new Date().toISOString(),
    });
    setSaved(true);
  };

  const handleReset = () => {
    setValues({});
    setValueMeta({});
    setNotes({});
    setHeaderValues({});
    setFinalNotes("");
    setSaveError("");
    setSaved(false);
    setConfirmReset(false);
    setWasReset(true);
    setLoadedFrom(null);
  };

  return (
    <div>
      <div style={S.header}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button style={S.btnOutline} onClick={onBack}>← Back</button>
          <div>
            <span style={S.logo}>{sheet.name}</span>
            <span style={{...S.logoBadge,background:sheet.type==="Field"?COLORS.success:COLORS.primary}}>{sheet.type}</span>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontSize:12,color:COLORS.textDim,textAlign:"right"}}>
            <div style={{fontWeight:600,color:COLORS.white}}>{operator.name}</div>
            <div>Badge: {operator.id}</div>
          </div>
        </div>
      </div>

      <div style={{padding:16,maxWidth:1200,margin:"0 auto"}}>

        {/* Date / Shift / Header */}
        <div style={{...S.card}}>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div style={{flex:"0 0 160px"}}><label style={S.label}>Date</label><input type="date" style={S.input} value={date} onChange={e=>setDate(e.target.value)} /></div>
            <div style={{flex:"0 0 120px"}}><label style={S.label}>Shift</label>
              <select style={S.input} value={shift} onChange={e=>setShift(e.target.value)}>
                <option>Day</option><option>Night</option>
              </select>
            </div>
            {(sheetBase.headerFields||[]).map(hf => (
              <div key={hf.key} style={{flex:1,minWidth:160}}>
                <label style={S.label}>{hf.label}</label>
                <input style={S.input} value={headerValues[hf.key]||""} onChange={e=>setHeaderValues({...headerValues,[hf.key]:e.target.value})} />
              </div>
            ))}
          </div>
          <div style={{marginTop:10,fontSize:12,color:COLORS.textDim}}>
            Current hours ({shift} shift): {sheet.timeSlots.join(", ")}
          </div>
          {loadedFrom && (
            <div style={{marginTop:8,fontSize:12,color:COLORS.success,display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:14}}>↻</span>
              Previously saved data loaded (last saved {new Date(loadedFrom).toLocaleString()}). You can continue entering data and save to update.
            </div>
          )}
        </div>

        {/* Parameters Table */}
        <div style={{...S.card,padding:0,overflow:"hidden"}} ref={tableRef}>
          <div style={{overflowX:"auto"}}>
            <table style={S.table}>
              <thead>
                <tr>
                  <th style={{...S.th,minWidth:60}}>Tag №</th>
                  <th style={{...S.th,minWidth:180}}>Description</th>
                  <th style={{...S.th,minWidth:50}}>Unit</th>
                  <th style={{...S.th,minWidth:70}}>Range</th>
                  {sheet.timeSlots.map((t,si)=>{
                    const unlocked = isAdmin || canEditSlot(params, si, sheet.timeSlots, values);
                    return <th key={t} style={{...S.th,minWidth:80,textAlign:"center",opacity:unlocked?1:0.4}}>
                      {t}
                      {!unlocked && <div style={{fontSize:9,color:COLORS.danger,fontWeight:400,textTransform:"none"}}>locked</div>}
                    </th>;
                  })}
                </tr>
              </thead>
              <tbody>
                {sheet.sections ? sheet.sections.map(sec => (
                  <Fragment key={sec.name}>
                    <tr><td colSpan={4+sheet.timeSlots.length} style={{...S.sectionHeader,padding:"8px 10px",background:COLORS.sectionBg,border:"none"}}>{sec.name}</td></tr>
                    {sec.parameters.map(p => <ParamRow key={p.tag} p={p} sheet={sheet} values={values} valueMeta={valueMeta} notes={notes} setVal={setVal} setNote={setNote} outOfRangeKeys={outOfRangeKeys} isAdmin={isAdmin} />)}
                  </Fragment>
                )) : params.map(p => <ParamRow key={p.tag} p={p} sheet={sheet} values={values} valueMeta={valueMeta} notes={notes} setVal={setVal} setNote={setNote} outOfRangeKeys={outOfRangeKeys} isAdmin={isAdmin} />)}
              </tbody>
            </table>
          </div>
        </div>

        {/* FINAL NOTES SECTION */}
        <div style={{...S.card}}>
          <div style={{fontSize:14,fontWeight:700,color:COLORS.white,marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Final Notes / General Comments
          </div>
          <div style={{fontSize:11,color:COLORS.textDim,marginBottom:8}}>
            Use this section for any general observations, shift handover notes, equipment status, or additional comments.
          </div>
          <textarea
            style={{...S.input,minHeight:100,resize:"vertical",lineHeight:"1.5"}}
            value={finalNotes}
            onChange={e=>setFinalNotes(e.target.value)}
            placeholder="Enter general comments, shift handover notes, equipment observations..."
            onPaste={isAdmin ? undefined : blockPaste}
          />
        </div>

        {/* Save & Reset */}
        {saveError && <div style={{color:COLORS.danger,fontSize:13,marginBottom:10,padding:"8px 12px",background:COLORS.dangerBg,borderRadius:8}}>{saveError}</div>}
        {saved && <div style={{...S.chip("green"),marginBottom:10,padding:"8px 12px",fontSize:13}}>Entry saved successfully!</div>}
        <div style={{display:"flex",gap:12}}>
          <button style={{...S.btn(COLORS.success),flex:1,padding:"14px 20px",fontSize:15}} onClick={handleSave}>
            Save Entry
          </button>
          {!confirmReset ? (
            <button style={{...S.btn(COLORS.danger),padding:"14px 20px",fontSize:15}} onClick={()=>setConfirmReset(true)}>
              Reset
            </button>
          ) : (
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <span style={{fontSize:12,color:COLORS.danger,whiteSpace:"nowrap"}}>Clear all data?</span>
              <button style={{...S.btn(COLORS.danger,true)}} onClick={handleReset}>Yes, Reset</button>
              <button style={{...S.btn(COLORS.textMuted,true)}} onClick={()=>setConfirmReset(false)}>Cancel</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ParamRow({ p, sheet, values, valueMeta, notes, setVal, setNote, outOfRangeKeys, isAdmin }) {
  const [expandedNote, setExpandedNote] = useState(null);
  const params = getParams(sheet);

  return (
    <tr>
      <td style={{...S.td,fontWeight:600,fontSize:11,color:COLORS.primary,fontFamily:"monospace"}}>{p.tag}</td>
      <td style={{...S.td,fontSize:11,maxWidth:200}}>{p.desc}</td>
      <td style={{...S.td,fontSize:11,color:COLORS.textDim}}>{p.unit}</td>
      <td style={{...S.td,fontSize:11,color:COLORS.textDim,whiteSpace:"nowrap"}}>{rangeStr(p)}</td>
      {sheet.timeSlots.map((slot, slotIndex) => {
        const key = `${p.tag}__${slot}`;
        const oor = outOfRangeKeys.includes(key);
        const hasNote = notes[key] && notes[key].trim();
        const meta = valueMeta && valueMeta[key];
        // Sequential enforcement: admin bypasses, operators can't skip
        const unlocked = isAdmin || canEditSlot(params, slotIndex, sheet.timeSlots, values);
        return (
          <td key={slot} style={{...S.td,padding:"3px 2px",position:"relative"}}>
            <input
              style={{...S.input,padding:"5px 6px",fontSize:12,textAlign:"center",width:72,...(oor?S.inputDanger:{}),...(!unlocked?S.inputDisabled:{})}}
              value={values[key]||""}
              onChange={e => unlocked ? setVal(p.tag,slot,e.target.value) : null}
              onPaste={isAdmin ? undefined : blockPaste}
              disabled={!unlocked}
              placeholder={unlocked ? "-" : ""}
              title={meta ? `${meta.by} — ${new Date(meta.at).toLocaleString()}` : (!unlocked ? "Complete the previous hour first" : "")}
            />
            {meta && values[key] && (
              <div style={{fontSize:8,color:COLORS.textMuted,textAlign:"center",lineHeight:"1.2",marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:72}}>
                {meta.by.split(" ")[0]} {new Date(meta.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
              </div>
            )}
            {oor && (
              <div style={{marginTop:2}}>
                {expandedNote===key ? (
                  <textarea
                    style={{...S.input,fontSize:10,padding:4,minHeight:40,resize:"vertical",borderColor:COLORS.danger,width:72}}
                    value={notes[key]||""}
                    onChange={e=>setNote(p.tag,slot,e.target.value)}
                    onPaste={isAdmin ? undefined : blockPaste}
                    placeholder="Note required..."
                    autoFocus
                    onBlur={()=>{if(notes[key]?.trim()) setExpandedNote(null);}}
                  />
                ) : (
                  <button
                    style={{fontSize:9,padding:"2px 6px",background:hasNote?COLORS.successBg:COLORS.dangerBg,color:hasNote?COLORS.success:COLORS.danger,border:`1px solid ${hasNote?"rgba(34,197,94,0.3)":"rgba(239,68,68,0.3)"}`,borderRadius:4,cursor:"pointer",width:"100%"}}
                    onClick={()=>setExpandedNote(key)}
                  >
                    {hasNote ? "✓ Note" : "⚠ Add Note"}
                  </button>
                )}
              </div>
            )}
          </td>
        );
      })}
    </tr>
  );
}

// ===================== COMPONENT: DASHBOARD =====================
function Dashboard({ savedEntries, onSelectEntry, onExportPDF, onBack, operator, sheets }) {
  const [siteFilter, setSiteFilter] = useState("All");
  const [typeFilter, setTypeFilter] = useState("All");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [viewMode, setViewMode] = useState("summary"); // summary, table, detail
  const [selectedSheet, setSelectedSheet] = useState(null);
  const sites = [...new Set(savedEntries.map(e=>e.site))];
  const sheetNames = [...new Set(savedEntries.map(e=>e.sheetName))];

  const filtered = savedEntries.filter(e => {
    if (siteFilter !== "All" && e.site !== siteFilter) return false;
    if (typeFilter !== "All" && e.type !== typeFilter) return false;
    if (dateFrom && e.date < dateFrom) return false;
    if (dateTo && e.date > dateTo) return false;
    if (selectedSheet && e.sheetName !== selectedSheet) return false;
    return true;
  });

  const stats = {
    total: filtered.length,
    field: filtered.filter(e=>e.type==="Field").length,
    dcs: filtered.filter(e=>e.type==="DCS").length,
    oor: filtered.reduce((acc,entry) => {
      const sheetBase = sheets.find(s=>s.name===entry.sheetName);
      if(!sheetBase) return acc;
      const ps = getParams(sheetBase);
      return acc + Object.entries(entry.values||{}).filter(([k,v]) => {
        const tag = k.split("__")[0];
        const p = ps.find(x=>x.tag===tag);
        return p && isOutOfRange(v,p);
      }).length;
    },0),
    dates: [...new Set(filtered.map(e=>e.date))].sort(),
    operators: [...new Set(filtered.map(e=>e.operator))],
  };

  // Excel-style table cells
  const cellS = {padding:"6px 8px",border:`1px solid ${COLORS.border}`,fontSize:11,whiteSpace:"nowrap"};
  const headS = {...cellS,background:COLORS.headerBg,fontWeight:700,color:COLORS.textDim,textTransform:"uppercase",fontSize:10,letterSpacing:"0.04em",position:"sticky",top:0,zIndex:2};
  const rowHover = {transition:"background 0.1s"};

  // Generate report data for table view
  const getReportRows = () => {
    return filtered.map(entry => {
      const sheetBase = sheets.find(s=>s.name===entry.sheetName);
      const ps = sheetBase ? getParams(sheetBase) : [];
      const filledCount = Object.values(entry.values||{}).filter(v=>v&&v.toString().trim()).length;
      const totalSlots = ps.length * ((sheetBase ? resolveSheet(sheetBase, entry.shift).timeSlots : []).length);
      const oorCount = Object.entries(entry.values||{}).filter(([k,v]) => {
        const tag = k.split("__")[0];
        const p = ps.find(x=>x.tag===tag);
        return p && isOutOfRange(v,p);
      }).length;
      return { entry, filledCount, totalSlots, oorCount, completion: totalSlots > 0 ? Math.round(filledCount/totalSlots*100) : 0 };
    });
  };

  // Detail view for a specific entry
  const DetailTable = ({entry}) => {
    const sheetBase = sheets.find(s=>s.name===entry.sheetName);
    if (!sheetBase) return <div style={{color:COLORS.textDim}}>Sheet definition not found</div>;
    const sheet = resolveSheet(sheetBase, entry.shift);
    const params = getParams(sheet);
    return (
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr>
              <th style={headS}>Tag</th>
              <th style={headS}>Description</th>
              <th style={headS}>Unit</th>
              <th style={headS}>Range</th>
              {sheet.timeSlots.map(t=><th key={t} style={{...headS,textAlign:"center"}}>{t}</th>)}
            </tr>
          </thead>
          <tbody>
            {sheet.sections ? sheet.sections.map(sec=>(
              <Fragment key={sec.name}>
                <tr><td colSpan={4+sheet.timeSlots.length} style={{...cellS,background:COLORS.sectionBg,fontWeight:700,color:COLORS.primary,fontSize:12}}>{sec.name}</td></tr>
                {sec.parameters.map(p=>(
                  <tr key={p.tag} style={rowHover}>
                    <td style={{...cellS,fontFamily:"monospace",color:COLORS.primary,fontWeight:600}}>{p.tag}</td>
                    <td style={{...cellS,maxWidth:200}}>{p.desc}</td>
                    <td style={{...cellS,color:COLORS.textDim}}>{p.unit}</td>
                    <td style={{...cellS,color:COLORS.textDim}}>{rangeStr(p)}</td>
                    {sheet.timeSlots.map(slot=>{
                      const key=`${p.tag}__${slot}`;
                      const val=entry.values?.[key]||"";
                      const oor=isOutOfRange(val,p);
                      return <td key={slot} style={{...cellS,textAlign:"center",background:oor?"rgba(239,68,68,0.15)":"transparent",color:oor?COLORS.danger:COLORS.text,fontWeight:val?"600":"400"}}>{val||"-"}</td>;
                    })}
                  </tr>
                ))}
              </Fragment>
            )) : params.map(p=>(
              <tr key={p.tag} style={rowHover}>
                <td style={{...cellS,fontFamily:"monospace",color:COLORS.primary,fontWeight:600}}>{p.tag}</td>
                <td style={{...cellS,maxWidth:200}}>{p.desc}</td>
                <td style={{...cellS,color:COLORS.textDim}}>{p.unit}</td>
                <td style={{...cellS,color:COLORS.textDim}}>{rangeStr(p)}</td>
                {sheet.timeSlots.map(slot=>{
                  const key=`${p.tag}__${slot}`;
                  const val=entry.values?.[key]||"";
                  const oor=isOutOfRange(val,p);
                  return <td key={slot} style={{...cellS,textAlign:"center",background:oor?"rgba(239,68,68,0.15)":"transparent",color:oor?COLORS.danger:COLORS.text,fontWeight:val?"600":"400"}}>{val||"-"}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  return (
    <div>
      <div style={S.header}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button style={S.btnOutline} onClick={onBack}>← Back</button>
          <span style={S.logo}>Report Dashboard</span>
          <span style={S.logoBadge}>REPORTS</span>
        </div>
        <div style={{fontSize:12,color:COLORS.textDim}}>{operator.name} ({operator.id})</div>
      </div>
      <div style={{padding:16,maxWidth:1200,margin:"0 auto"}}>

        {/* Filter Bar - Excel toolbar style */}
        <div style={{...S.card,padding:14,marginBottom:16}}>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div><label style={S.label}>Date From</label><input type="date" style={{...S.input,width:140}} value={dateFrom} onChange={e=>setDateFrom(e.target.value)} /></div>
            <div><label style={S.label}>Date To</label><input type="date" style={{...S.input,width:140}} value={dateTo} onChange={e=>setDateTo(e.target.value)} /></div>
            <div><label style={S.label}>Site</label>
              <select style={{...S.input,width:140}} value={siteFilter} onChange={e=>setSiteFilter(e.target.value)}>
                <option value="All">All Sites</option>
                {sites.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div><label style={S.label}>Type</label>
              <select style={{...S.input,width:100}} value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
                <option value="All">All</option><option value="Field">Field</option><option value="DCS">DCS</option>
              </select>
            </div>
            <div><label style={S.label}>Log Sheet</label>
              <select style={{...S.input,width:200}} value={selectedSheet||""} onChange={e=>setSelectedSheet(e.target.value||null)}>
                <option value="">All Sheets</option>
                {sheetNames.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <button style={S.btn(COLORS.textMuted,true)} onClick={()=>{setDateFrom("");setDateTo("");setSiteFilter("All");setTypeFilter("All");setSelectedSheet(null);}}>Clear Filters</button>
          </div>
        </div>

        {/* Stats Row */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:16}}>
          {[
            {label:"Total Entries",val:stats.total,color:COLORS.primary},
            {label:"Field Logs",val:stats.field,color:COLORS.success},
            {label:"DCS Logs",val:stats.dcs,color:COLORS.warning},
            {label:"Out of Range",val:stats.oor,color:COLORS.danger},
            {label:"Unique Dates",val:stats.dates.length,color:"#8b5cf6"},
            {label:"Operators",val:stats.operators.length,color:"#06b6d4"},
          ].map(s => (
            <div key={s.label} style={{...S.card,textAlign:"center",padding:12}}>
              <div style={{fontSize:24,fontWeight:800,color:s.color}}>{s.val}</div>
              <div style={{fontSize:10,color:COLORS.textDim,fontWeight:600,marginTop:2}}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* View Mode Tabs */}
        <div style={{display:"flex",gap:4,marginBottom:16}}>
          <div style={S.tabs}>
            <button style={S.tab(viewMode==="summary")} onClick={()=>setViewMode("summary")}>Summary Table</button>
            <button style={S.tab(viewMode==="table")} onClick={()=>setViewMode("table")}>Data Report</button>
            <button style={S.tab(viewMode==="detail")} onClick={()=>setViewMode("detail")}>Detailed View</button>
            <button style={S.tab(viewMode==="trend")} onClick={()=>setViewMode("trend")}>📈 Trends</button>
          </div>
        </div>

        {/* ===== SUMMARY TABLE VIEW ===== */}
        {viewMode === "summary" && (
          <div style={{...S.card,padding:0,overflow:"hidden"}}>
            <div style={{padding:"12px 16px",borderBottom:`1px solid ${COLORS.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:14,fontWeight:700,color:COLORS.white}}>Log Entry Summary Report</div>
              <div style={{fontSize:11,color:COLORS.textDim}}>{filtered.length} entries</div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr>
                    <th style={headS}>#</th>
                    <th style={headS}>Date</th>
                    <th style={headS}>Sheet Name</th>
                    <th style={headS}>Type</th>
                    <th style={headS}>Shift</th>
                    <th style={headS}>Operator</th>
                    <th style={headS}>Filled</th>
                    <th style={headS}>Completion</th>
                    <th style={headS}>Out of Range</th>
                    <th style={headS}>Saved At</th>
                    <th style={headS}>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0 ? (
                    <tr><td colSpan={11} style={{...cellS,textAlign:"center",padding:40,color:COLORS.textDim}}>No entries match the filters</td></tr>
                  ) : getReportRows().map((row,i) => {
                    const compColor = row.completion >= 80 ? COLORS.success : row.completion >= 50 ? COLORS.warning : COLORS.danger;
                    return (
                      <tr key={i} style={{...rowHover,cursor:"pointer"}} onClick={()=>onSelectEntry(row.entry)}
                        onMouseOver={e=>e.currentTarget.style.background=COLORS.cardHover}
                        onMouseOut={e=>e.currentTarget.style.background="transparent"}>
                        <td style={{...cellS,color:COLORS.textDim}}>{i+1}</td>
                        <td style={{...cellS,fontWeight:600}}>{row.entry.date}</td>
                        <td style={{...cellS,color:COLORS.white,fontWeight:600}}>{row.entry.sheetName}</td>
                        <td style={cellS}><span style={S.chip(row.entry.type==="Field"?"green":"yellow")}>{row.entry.type}</span></td>
                        <td style={cellS}>{row.entry.shift}</td>
                        <td style={cellS}>{row.entry.operator}</td>
                        <td style={{...cellS,textAlign:"center"}}>{row.filledCount}/{row.totalSlots}</td>
                        <td style={{...cellS,textAlign:"center"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <div style={{flex:1,height:6,background:COLORS.inputBg,borderRadius:3,overflow:"hidden",minWidth:50}}>
                              <div style={{width:`${row.completion}%`,height:"100%",background:compColor,borderRadius:3}} />
                            </div>
                            <span style={{fontSize:10,fontWeight:700,color:compColor}}>{row.completion}%</span>
                          </div>
                        </td>
                        <td style={{...cellS,textAlign:"center",color:row.oorCount>0?COLORS.danger:COLORS.success,fontWeight:700}}>{row.oorCount>0?row.oorCount:"✓"}</td>
                        <td style={{...cellS,fontSize:10,color:COLORS.textDim}}>{new Date(row.entry.savedAt).toLocaleString()}</td>
                        <td style={cellS}>
                          <button style={S.btn(COLORS.primary,true)} onClick={e=>{e.stopPropagation();onExportPDF(row.entry);}}>Export</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ===== DATA REPORT VIEW ===== */}
        {viewMode === "table" && (
          <div>
            {filtered.length === 0 ? (
              <div style={{...S.card,textAlign:"center",padding:40,color:COLORS.textDim}}>No entries match the filters</div>
            ) : filtered.map((entry,i) => {
              const sheetBase = sheets.find(s=>s.name===entry.sheetName);
              const sheet = sheetBase ? resolveSheet(sheetBase, entry.shift) : null;
              const params = sheet ? getParams(sheet) : [];
              const filledVals = Object.entries(entry.values||{}).filter(([k,v])=>v&&v.toString().trim());
              return (
                <div key={i} style={{...S.card,padding:0,overflow:"hidden",marginBottom:16}}>
                  {/* Entry header bar */}
                  <div style={{padding:"10px 16px",background:COLORS.headerBg,borderBottom:`1px solid ${COLORS.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                    <div>
                      <span style={{fontWeight:700,fontSize:14,color:COLORS.white}}>{entry.sheetName}</span>
                      <span style={{...S.chip(entry.type==="Field"?"green":"yellow"),marginLeft:8}}>{entry.type}</span>
                    </div>
                    <div style={{display:"flex",gap:12,fontSize:11,color:COLORS.textDim}}>
                      <span>Date: <strong style={{color:COLORS.white}}>{entry.date}</strong></span>
                      <span>Shift: <strong style={{color:COLORS.white}}>{entry.shift}</strong></span>
                      <span>Operator: <strong style={{color:COLORS.white}}>{entry.operator}</strong></span>
                      <span>Values: <strong style={{color:COLORS.white}}>{filledVals.length}</strong></span>
                    </div>
                    <button style={S.btn(COLORS.primary,true)} onClick={()=>onExportPDF(entry)}>Export</button>
                  </div>
                  {/* Data table */}
                  {sheet && (
                    <div style={{overflowX:"auto",maxHeight:400,overflowY:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse"}}>
                        <thead>
                          <tr>
                            <th style={headS}>Tag</th>
                            <th style={headS}>Description</th>
                            <th style={headS}>Unit</th>
                            <th style={headS}>Range</th>
                            {sheet.timeSlots.map(t=><th key={t} style={{...headS,textAlign:"center"}}>{t}</th>)}
                          </tr>
                        </thead>
                        <tbody>
                          {sheet.sections ? sheet.sections.map(sec=>(
                            <Fragment key={sec.name}>
                              <tr><td colSpan={4+sheet.timeSlots.length} style={{...cellS,background:COLORS.sectionBg,fontWeight:700,color:COLORS.primary,fontSize:11}}>{sec.name}</td></tr>
                              {sec.parameters.map(p=>{
                                const hasData = sheet.timeSlots.some(sl=>entry.values?.[`${p.tag}__${sl}`]);
                                if(!hasData) return null;
                                return (
                                  <tr key={p.tag}>
                                    <td style={{...cellS,fontFamily:"monospace",color:COLORS.primary,fontSize:10}}>{p.tag}</td>
                                    <td style={{...cellS,fontSize:10}}>{p.desc}</td>
                                    <td style={{...cellS,fontSize:10,color:COLORS.textDim}}>{p.unit}</td>
                                    <td style={{...cellS,fontSize:10,color:COLORS.textDim}}>{rangeStr(p)}</td>
                                    {sheet.timeSlots.map(slot=>{
                                      const key=`${p.tag}__${slot}`;const val=entry.values?.[key]||"";const oor=isOutOfRange(val,p);
                                      return <td key={slot} style={{...cellS,textAlign:"center",fontSize:11,background:oor?"rgba(239,68,68,0.15)":"transparent",color:oor?COLORS.danger:COLORS.text,fontWeight:val?"600":"400"}}>{val||""}</td>;
                                    })}
                                  </tr>
                                );
                              })}
                            </Fragment>
                          )) : params.map(p=>{
                            const hasData = sheet.timeSlots.some(sl=>entry.values?.[`${p.tag}__${sl}`]);
                            if(!hasData) return null;
                            return (
                              <tr key={p.tag}>
                                <td style={{...cellS,fontFamily:"monospace",color:COLORS.primary,fontSize:10}}>{p.tag}</td>
                                <td style={{...cellS,fontSize:10}}>{p.desc}</td>
                                <td style={{...cellS,fontSize:10,color:COLORS.textDim}}>{p.unit}</td>
                                <td style={{...cellS,fontSize:10,color:COLORS.textDim}}>{rangeStr(p)}</td>
                                {sheet.timeSlots.map(slot=>{
                                  const key=`${p.tag}__${slot}`;const val=entry.values?.[key]||"";const oor=isOutOfRange(val,p);
                                  return <td key={slot} style={{...cellS,textAlign:"center",fontSize:11,background:oor?"rgba(239,68,68,0.15)":"transparent",color:oor?COLORS.danger:COLORS.text,fontWeight:val?"600":"400"}}>{val||""}</td>;
                                })}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                  {entry.finalNotes && <div style={{padding:"8px 16px",borderTop:`1px solid ${COLORS.border}`,fontSize:11,color:COLORS.textDim}}>Notes: {entry.finalNotes}</div>}
                </div>
              );
            })}
          </div>
        )}

        {/* ===== DETAILED VIEW ===== */}
        {viewMode === "detail" && (
          <div>
            {filtered.length === 0 ? (
              <div style={{...S.card,textAlign:"center",padding:40,color:COLORS.textDim}}>No entries match the filters</div>
            ) : filtered.map((entry,i) => (
              <div key={i} style={{...S.card,padding:0,overflow:"hidden",marginBottom:16}}>
                <div style={{padding:"10px 16px",background:COLORS.headerBg,borderBottom:`1px solid ${COLORS.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                  <div>
                    <span style={{fontWeight:700,fontSize:14,color:COLORS.white}}>{entry.sheetName}</span>
                    <span style={{marginLeft:8,fontSize:12,color:COLORS.textDim}}>{entry.date} | {entry.shift} | {entry.operator}</span>
                  </div>
                  <button style={S.btn(COLORS.primary,true)} onClick={()=>onExportPDF(entry)}>Export</button>
                </div>
                <div style={{padding:0}}>
                  <DetailTable entry={entry} />
                </div>
                {entry.finalNotes && <div style={{padding:"8px 16px",borderTop:`1px solid ${COLORS.border}`,fontSize:11,color:COLORS.textDim}}>Notes: {entry.finalNotes}</div>}
              </div>
            ))}
          </div>
        )}

        {/* ===== TREND VIEW ===== */}
        {viewMode === "trend" && (
          <TrendView entries={filtered} sheets={sheets} />
        )}

      </div>
    </div>
  );
}
// ===================== COMPONENT: TREND VIEW =====================
function TrendView({ entries, sheets }) {
  const LINE_COLORS=["#3b82f6","#22c55e","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#f97316","#14b8a6","#a855f7","#64748b","#84cc16"];
  const sheetNames=[...new Set(entries.map(e=>e.sheetName))];
  const [selSheet,setSelSheet]=useState(sheetNames[0]||"");
  const [selParam,setSelParam]=useState("");

  const sheetBase=sheets.find(s=>s.name===selSheet);
  const params=sheetBase?getParams(sheetBase):[];
  const sheetEntries=entries.filter(e=>e.sheetName===selSheet).sort((a,b)=>a.date.localeCompare(b.date)||a.shift.localeCompare(b.shift));
  const daySlots=sheetBase?sheetBase.daySlots:[];
  const nightSlots=sheetBase?sheetBase.nightSlots:[];
  const allSlots=[...new Set([...daySlots,...nightSlots])];

  useEffect(()=>{
    if(params.length>0&&(!selParam||!params.find(p=>p.tag===selParam))) setSelParam(params[0].tag);
  },[selSheet]);

  const paramObj=params.find(p=>p.tag===selParam);

  // Combined data: same tag across ALL hours and dates in one timeline
  const combinedData=[];
  sheetEntries.forEach(entry=>{
    const slots=entry.shift==="Night"?nightSlots:daySlots;
    slots.forEach(slot=>{
      const key=`${selParam}__${slot}`;
      const raw=entry.values?.[key];
      const num=parseFloat(raw);
      combinedData.push({date:entry.date,shift:entry.shift,slot,label:`${entry.date.slice(5)} ${slot}`,value:isNaN(num)?null:num,operator:entry.operator});
    });
  });
  const combinedFiltered=combinedData.filter(d=>d.value!==null);

  // Multi-line: each date/shift entry as a separate colored line across hours
  const multiLineData=sheetEntries.map((entry,ei)=>{
    const slots=entry.shift==="Night"?nightSlots:daySlots;
    const points=slots.map(slot=>{
      const key=`${selParam}__${slot}`;
      const num=parseFloat(entry.values?.[key]);
      return {date:entry.date,shift:entry.shift,label:slot,value:isNaN(num)?null:num};
    }).filter(d=>d.value!==null);
    return {slot:`${entry.date.slice(5)} ${entry.shift}`,color:LINE_COLORS[ei%LINE_COLORS.length],points};
  }).filter(s=>s.points.length>0);

  // SVG single-line chart
  const SVGChart=({data,title,minRange,maxRange,unit,height=220})=>{
    if(data.length<1) return <div style={{padding:30,textAlign:"center",color:COLORS.textDim,fontSize:12}}>No numeric data for this parameter</div>;
    const W=Math.max(700,data.length*40),H=height,pad={t:30,r:20,b:55,l:55};
    const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
    const vals=data.map(d=>d.value);
    let dMin=Math.min(...vals),dMax=Math.max(...vals);
    if(minRange!=null) dMin=Math.min(dMin,minRange);
    if(maxRange!=null&&maxRange<99999) dMax=Math.max(dMax,maxRange);
    const mg=(dMax-dMin)*0.1||1;
    const yMin=dMin-mg,yMax=dMax+mg;
    const xStep=data.length>1?cW/(data.length-1):cW/2;
    const toX=i=>pad.l+i*xStep;
    const toY=v=>pad.t+cH-((v-yMin)/(yMax-yMin))*cH;
    const pathD=data.map((d,i)=>`${i===0?"M":"L"}${toX(i).toFixed(1)},${toY(d.value).toFixed(1)}`).join(" ");
    const hasMin=minRange!=null,hasMax=maxRange!=null&&maxRange<99999;
    const yTicks=5;
    const yTickVals=Array.from({length:yTicks+1},(_,i)=>yMin+(yMax-yMin)*i/yTicks);
    return(
      <div style={{overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,height:"auto",background:COLORS.card,borderRadius:8}}>
          <text x={W/2} y={16} textAnchor="middle" fill={COLORS.white} fontSize="12" fontWeight="700">{title}</text>
          {(hasMin||hasMax)&&<rect x={pad.l} y={toY(hasMax?maxRange:yMax)} width={cW} height={Math.abs(toY(hasMin?minRange:yMin)-toY(hasMax?maxRange:yMax))} fill="rgba(34,197,94,0.08)" />}
          {hasMin&&<line x1={pad.l} x2={pad.l+cW} y1={toY(minRange)} y2={toY(minRange)} stroke={COLORS.success} strokeWidth="1" strokeDasharray="4,3" />}
          {hasMax&&<line x1={pad.l} x2={pad.l+cW} y1={toY(maxRange)} y2={toY(maxRange)} stroke={COLORS.danger} strokeWidth="1" strokeDasharray="4,3" />}
          {yTickVals.map((v,i)=><g key={i}><line x1={pad.l} x2={pad.l+cW} y1={toY(v)} y2={toY(v)} stroke={COLORS.border} strokeWidth="0.5" /><text x={pad.l-6} y={toY(v)+4} textAnchor="end" fill={COLORS.textDim} fontSize="9">{v%1===0?v:v.toFixed(1)}</text></g>)}
          {unit&&<text x={8} y={pad.t+cH/2} textAnchor="middle" fill={COLORS.textDim} fontSize="9" transform={`rotate(-90,8,${pad.t+cH/2})`}>{unit}</text>}
          <path d={pathD} fill="none" stroke={COLORS.primary} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
          {data.map((d,i)=>{const oor=(hasMin&&d.value<minRange)||(hasMax&&d.value>maxRange);return <g key={i}><circle cx={toX(i)} cy={toY(d.value)} r="3.5" fill={oor?COLORS.danger:COLORS.primary} stroke={COLORS.card} strokeWidth="1.5" /><text x={toX(i)} y={toY(d.value)-8} textAnchor="middle" fill={oor?COLORS.danger:COLORS.text} fontSize="7" fontWeight="600">{d.value}</text></g>;})}
          {data.map((d,i)=><text key={i} x={toX(i)} y={H-pad.b+14} textAnchor="middle" fill={COLORS.textDim} fontSize="7" transform={`rotate(-45,${toX(i)},${H-pad.b+14})`}>{d.label}</text>)}
          {hasMin&&<text x={pad.l+cW+4} y={toY(minRange)+3} fill={COLORS.success} fontSize="8">Min:{minRange}</text>}
          {hasMax&&<text x={pad.l+cW+4} y={toY(maxRange)+3} fill={COLORS.danger} fontSize="8">Max:{maxRange}</text>}
        </svg>
      </div>
    );
  };

  // SVG multi-line chart: each hour slot is a different colored line
  const SVGMultiChart=({lines,title,minRange,maxRange,unit,height=260})=>{
    const allVals=lines.flatMap(l=>l.points.map(p=>p.value));
    if(allVals.length<1) return <div style={{padding:30,textAlign:"center",color:COLORS.textDim,fontSize:12}}>No numeric data</div>;
    const xLabels=[...new Set(lines.flatMap(l=>l.points.map(p=>p.label)))];
    const W=Math.max(700,xLabels.length*55),H=height,pad={t:30,r:120,b:55,l:55};
    const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
    let dMin=Math.min(...allVals),dMax=Math.max(...allVals);
    if(minRange!=null) dMin=Math.min(dMin,minRange);
    if(maxRange!=null&&maxRange<99999) dMax=Math.max(dMax,maxRange);
    const mg=(dMax-dMin)*0.1||1;
    const yMin=dMin-mg,yMax=dMax+mg;
    const xStep=xLabels.length>1?cW/(xLabels.length-1):cW/2;
    const toX=i=>pad.l+i*xStep;
    const toY=v=>pad.t+cH-((v-yMin)/(yMax-yMin))*cH;
    const hasMin=minRange!=null,hasMax=maxRange!=null&&maxRange<99999;
    const yTicks=5;
    const yTickVals=Array.from({length:yTicks+1},(_,i)=>yMin+(yMax-yMin)*i/yTicks);
    return(
      <div style={{overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,height:"auto",background:COLORS.card,borderRadius:8}}>
          <text x={(pad.l+W-pad.r)/2} y={16} textAnchor="middle" fill={COLORS.white} fontSize="12" fontWeight="700">{title}</text>
          {(hasMin||hasMax)&&<rect x={pad.l} y={toY(hasMax?maxRange:yMax)} width={cW} height={Math.abs(toY(hasMin?minRange:yMin)-toY(hasMax?maxRange:yMax))} fill="rgba(34,197,94,0.06)" />}
          {hasMin&&<line x1={pad.l} x2={pad.l+cW} y1={toY(minRange)} y2={toY(minRange)} stroke={COLORS.success} strokeWidth="1" strokeDasharray="4,3" />}
          {hasMax&&<line x1={pad.l} x2={pad.l+cW} y1={toY(maxRange)} y2={toY(maxRange)} stroke={COLORS.danger} strokeWidth="1" strokeDasharray="4,3" />}
          {yTickVals.map((v,i)=><g key={i}><line x1={pad.l} x2={pad.l+cW} y1={toY(v)} y2={toY(v)} stroke={COLORS.border} strokeWidth="0.5" /><text x={pad.l-6} y={toY(v)+4} textAnchor="end" fill={COLORS.textDim} fontSize="9">{v%1===0?v:v.toFixed(1)}</text></g>)}
          {unit&&<text x={8} y={pad.t+cH/2} textAnchor="middle" fill={COLORS.textDim} fontSize="9" transform={`rotate(-90,8,${pad.t+cH/2})`}>{unit}</text>}
          {lines.map(line=>{
            const pts=line.points.map(p=>{const xi=xLabels.indexOf(p.label);return xi>=0?{x:toX(xi),y:toY(p.value)}:null;}).filter(Boolean);
            if(pts.length<1) return null;
            const d=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
            return <g key={line.slot}><path d={d} fill="none" stroke={line.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />{pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="3" fill={line.color} stroke={COLORS.card} strokeWidth="1.5" />)}</g>;
          })}
          {xLabels.map((lb,i)=><text key={i} x={toX(i)} y={H-pad.b+14} textAnchor="middle" fill={COLORS.textDim} fontSize="7" transform={`rotate(-45,${toX(i)},${H-pad.b+14})`}>{lb}</text>)}
          {lines.map((line,i)=>(
            <g key={line.slot}>
              <line x1={W-pad.r+10} x2={W-pad.r+24} y1={pad.t+i*16+4} y2={pad.t+i*16+4} stroke={line.color} strokeWidth="2" />
              <circle cx={W-pad.r+17} cy={pad.t+i*16+4} r="3" fill={line.color} />
              <text x={W-pad.r+28} y={pad.t+i*16+7} fill={COLORS.textDim} fontSize="9">{line.slot}</text>
            </g>
          ))}
        </svg>
      </div>
    );
  };

  return(
    <div>
      <div style={{...S.card,padding:14,marginBottom:16}}>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{flex:"0 0 200px"}}><label style={S.label}>Log Sheet</label>
            <select style={S.input} value={selSheet} onChange={e=>{setSelSheet(e.target.value);setSelParam("");}}>
              {sheetNames.length===0&&<option value="">No entries</option>}
              {sheetNames.map(n=><option key={n} value={n}>{n}</option>)}
            </select>
          </div>
          <div style={{flex:1,minWidth:250}}><label style={S.label}>Parameter</label>
            <select style={S.input} value={selParam} onChange={e=>setSelParam(e.target.value)}>
              {params.map(p=><option key={p.tag} value={p.tag}>{p.tag} \u2014 {p.desc}</option>)}
            </select>
          </div>
        </div>
      </div>

      {paramObj&&(
        <div style={{...S.card,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:COLORS.white,marginBottom:4}}>Combined Hourly Trend \u2014 {selParam} ({paramObj.desc})</div>
          <div style={{fontSize:11,color:COLORS.textDim,marginBottom:12}}>All hours across all dates on one continuous trend line</div>
          <SVGChart data={combinedFiltered} title={`${selParam} \u2014 All Hours Combined`} minRange={paramObj.min} maxRange={paramObj.max} unit={paramObj.unit} height={220} />
        </div>
      )}

      {paramObj&&multiLineData.length>0&&(
        <div style={{...S.card,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:COLORS.white,marginBottom:4}}>Daily Comparison 2014 {selParam} ({paramObj.desc})</div>
          <div style={{fontSize:11,color:COLORS.textDim,marginBottom:12}}>Each date/shift as a separate colored line across hours (see legend)</div>
          <SVGMultiChart lines={multiLineData} title={`${selParam} 2014 By Date/Shift`} minRange={paramObj.min} maxRange={paramObj.max} unit={paramObj.unit} height={260} />
        </div>
      )}

      {paramObj&&combinedFiltered.length>0&&(
        <div style={{...S.card}}>
          <div style={{fontSize:13,fontWeight:700,color:COLORS.white,marginBottom:12}}>Data Table \u2014 {selParam}</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr>
                {["Date","Shift","Hour","Value","Operator","Status"].map(h=><th key={h} style={{padding:"5px 8px",fontSize:10,fontWeight:700,color:COLORS.textDim,borderBottom:`1px solid ${COLORS.border}`,textAlign:h==="Value"||h==="Status"?"center":"left"}}>{h}</th>)}
              </tr></thead>
              <tbody>
                {combinedFiltered.map((d,i)=>{const oor=isOutOfRange(d.value,paramObj);return(
                  <tr key={i}>
                    <td style={{padding:"4px 8px",fontSize:11,borderBottom:`1px solid ${COLORS.border}`}}>{d.date}</td>
                    <td style={{padding:"4px 8px",fontSize:11,borderBottom:`1px solid ${COLORS.border}`}}>{d.shift}</td>
                    <td style={{padding:"4px 8px",fontSize:11,borderBottom:`1px solid ${COLORS.border}`,fontWeight:600}}>{d.slot}</td>
                    <td style={{padding:"4px 8px",fontSize:11,borderBottom:`1px solid ${COLORS.border}`,textAlign:"center",fontWeight:700,color:oor?COLORS.danger:COLORS.success}}>{d.value}</td>
                    <td style={{padding:"4px 8px",fontSize:11,borderBottom:`1px solid ${COLORS.border}`}}>{d.operator}</td>
                    <td style={{padding:"4px 8px",fontSize:11,borderBottom:`1px solid ${COLORS.border}`,textAlign:"center"}}>{oor?<span style={S.chip("red")}>OOR</span>:<span style={S.chip("green")}>OK</span>}</td>
                  </tr>
                );})}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {entries.length===0&&<div style={{...S.card,textAlign:"center",padding:40,color:COLORS.textDim}}>No entries available. Save log sheet data first to see trends.</div>}
    </div>
  );
}
