// ===================== COMPONENT: PDF PREVIEW =====================
function PDFPreview({ entry, onBack, sheets }) {
  const sheetBase = sheets.find(s=>s.name===entry.sheetName);
  const sheet = sheetBase ? resolveSheet(sheetBase, entry.shift) : null;
  const params = sheet ? getParams(sheet) : [];
  const timeSlots = entry.timeSlots || (sheet ? sheet.timeSlots : []);
  const [email, setEmail] = useState("");
  const [sent, setSent] = useState(false);
  const printRef = useRef(null);

  // Build standalone HTML string for download
  const buildHTML = () => {
    const hasSections = sheet && sheet.sections;
    let paramRowsHTML = "";
    const renderParamRows = (paramList) => {
      return paramList.map(p => {
        let cells = timeSlots.map(slot => {
          const key = `${p.tag}__${slot}`;
          const val = entry.values?.[key] || "";
          const oor = isOutOfRange(val, p);
          const note = entry.notes?.[key];
          const meta = entry.valueMeta?.[key];
          const bg = oor ? "#fde8e8" : "#fff";
          const clr = oor ? "#c62828" : "#111";
          let metaHtml = (meta && val) ? `<div style="font-size:7px;color:#888">${meta.by.split(" ")[0]} ${new Date(meta.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>` : "";
          let noteHtml = note ? `<div style="font-size:8px;color:#555;font-style:italic">(${note})</div>` : "";
          return `<td style="border:1px solid #bbb;padding:3px;text-align:center;background:${bg};color:${clr}">${val}${metaHtml}${noteHtml}</td>`;
        }).join("");
        return `<tr><td style="border:1px solid #bbb;padding:3px;font-family:monospace;font-size:10px">${p.tag}</td><td style="border:1px solid #bbb;padding:3px;font-size:10px">${p.desc}</td><td style="border:1px solid #bbb;padding:3px;text-align:center;font-size:10px">${p.unit}</td><td style="border:1px solid #bbb;padding:3px;text-align:center;font-size:10px">${rangeStr(p)}</td>${cells}</tr>`;
      }).join("\n");
    };

    if (hasSections) {
      paramRowsHTML = sheet.sections.map(sec => {
        let sectionHeader = `<tr><td colspan="${4+timeSlots.length}" style="background:#e8f0fe;font-weight:700;font-size:12px;padding:6px 8px;border:1px solid #bbb;color:#1a56db">${sec.name}</td></tr>`;
        return sectionHeader + "\n" + renderParamRows(sec.parameters);
      }).join("\n");
    } else {
      paramRowsHTML = renderParamRows(params);
    }

    const headerFieldsHTML = Object.entries(entry.headerValues||{}).map(([k,v]) => v ? `<div><strong>${k}:</strong> ${v}</div>` : "").join("");
    const finalNotesHTML = entry.finalNotes ? `<div style="margin-top:20px;padding:12px;border:1px solid #bbb;border-radius:4px"><div style="font-size:13px;font-weight:700;margin-bottom:6px">Final Notes / General Comments</div><div style="font-size:12px;white-space:pre-wrap;line-height:1.5">${entry.finalNotes}</div></div>` : "";
    const lastModHTML = entry.lastModifiedBy ? `<div><strong>Last Modified:</strong> ${entry.lastModifiedBy} at ${new Date(entry.lastModifiedAt).toLocaleString()}</div>` : "";

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${entry.sheetName} - ${entry.date} - ${entry.shift} Shift</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; color: #111; }
  @media print {
    body { margin: 10px; }
    .no-print { display: none !important; }
    table { page-break-inside: auto; }
    tr { page-break-inside: avoid; }
  }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { background: #e5e7eb; border: 1px solid #bbb; padding: 5px; font-size: 11px; }
  .header-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; margin-bottom: 20px; }
  .title { text-align: center; margin-bottom: 20px; }
  .title h1 { font-size: 20px; margin: 0; }
  .title h2 { font-size: 16px; margin: 4px 0 0; font-weight: 600; }
  .print-btn { padding: 10px 24px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; font-weight: 600; margin: 4px; }
</style>
</head>
<body>
<div class="no-print" style="text-align:center;margin-bottom:20px;padding:12px;background:#f0f4ff;border-radius:8px">
  <button class="print-btn" style="background:#2563eb;color:#fff" onclick="window.print()">🖨️ Print / Save as PDF</button>
</div>
<div class="title">
  <h1>SOCAR POLYMER</h1>
  <h2>${entry.sheetName}</h2>
</div>
<div class="header-grid">
  <div><strong>Date:</strong> ${entry.date}</div>
  <div><strong>Shift:</strong> ${entry.shift}</div>
  <div><strong>Operator:</strong> ${entry.operator} (${entry.operatorId})</div>
  <div><strong>Saved:</strong> ${new Date(entry.savedAt).toLocaleString()}</div>
  ${lastModHTML}
  ${headerFieldsHTML}
</div>
<table>
  <thead>
    <tr>
      <th>Tag</th><th>Description</th><th>Unit</th><th>Range</th>
      ${timeSlots.map(t => `<th>${t}</th>`).join("")}
    </tr>
  </thead>
  <tbody>
    ${paramRowsHTML}
  </tbody>
</table>
${finalNotesHTML}
<div class="no-print" style="text-align:center;margin-top:24px;font-size:12px;color:#888">
  Generated from SOCAR Polymer Digital Log Sheet System
</div>
</body>
</html>`;
  };

  const handleDownloadHTML = () => {
    const html = buildHTML();
    const blob = new Blob([html], {type: "text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${entry.sheetName.replace(/\s+/g,"_")}_${entry.date}_${entry.shift}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handlePrint = () => {
    const html = buildHTML();
    const win = window.open("", "_blank");
    if (win) {
      win.document.write(html);
      win.document.close();
      setTimeout(() => win.print(), 500);
    }
  };

  const handleShare = async () => {
    const html = buildHTML();
    const blob = new Blob([html], {type: "text/html"});
    const file = new File([blob], `${entry.sheetName.replace(/\s+/g,"_")}_${entry.date}_${entry.shift}.html`, {type: "text/html"});
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      try {
        await navigator.share({
          title: `${entry.sheetName} - ${entry.date} - ${entry.shift} Shift`,
          text: `Log sheet: ${entry.sheetName} | ${entry.date} | ${entry.shift} shift | Operator: ${entry.operator}`,
          files: [file],
        });
      } catch(e) { /* user cancelled */ }
    } else if (navigator.share) {
      try {
        await navigator.share({
          title: `${entry.sheetName} - ${entry.date} - ${entry.shift} Shift`,
          text: `Log sheet: ${entry.sheetName} | ${entry.date} | ${entry.shift} shift | Operator: ${entry.operator}`,
        });
      } catch(e) { /* user cancelled */ }
    } else {
      handleDownloadHTML();
    }
  };

  return (
    <div>
      <div style={S.header}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button style={S.btnOutline} onClick={onBack}>← Back</button>
          <span style={S.logo}>Export Preview</span>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          <button style={S.btn("#2563eb",true)} onClick={handlePrint}>🖨️ Print / PDF</button>
          <button style={S.btn(COLORS.success,true)} onClick={handleDownloadHTML}>⬇ Download HTML</button>
          <button style={S.btn("#8b5cf6",true)} onClick={handleShare}>📤 Share</button>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <input style={{...S.input,width:160,padding:"6px 10px"}} placeholder="Manager email..." value={email} onChange={e=>setEmail(e.target.value)} />
            <button style={S.btn(COLORS.warning,true)} onClick={()=>{
              if(email) {setSent(true); setTimeout(()=>setSent(false),3000);}
            }}>{sent?"✓ Sent!":"📧 Email"}</button>
          </div>
        </div>
      </div>
      <div style={{padding:20,maxWidth:1000,margin:"0 auto"}}>
        <div ref={printRef} style={{...S.card,background:"#fff",color:"#111",padding:32,borderRadius:8,fontFamily:"serif"}}>
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontSize:20,fontWeight:700}}>SOCAR POLYMER</div>
            <div style={{fontSize:16,fontWeight:600,marginTop:4}}>{entry.sheetName}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:13,marginBottom:20}}>
            <div><strong>Date:</strong> {entry.date}</div>
            <div><strong>Shift:</strong> {entry.shift}</div>
            <div><strong>Operator:</strong> {entry.operator} ({entry.operatorId})</div>
            <div><strong>Saved:</strong> {new Date(entry.savedAt).toLocaleString()}</div>
            {entry.lastModifiedBy && <div style={{gridColumn:"1/3"}}><strong>Last Modified:</strong> {entry.lastModifiedBy} at {new Date(entry.lastModifiedAt).toLocaleString()}</div>}
          </div>
          {sheet && (
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <thead>
                <tr style={{background:"#e5e7eb"}}>
                  <th style={{border:"1px solid #ccc",padding:4}}>Tag</th>
                  <th style={{border:"1px solid #ccc",padding:4}}>Description</th>
                  <th style={{border:"1px solid #ccc",padding:4}}>Unit</th>
                  <th style={{border:"1px solid #ccc",padding:4}}>Range</th>
                  {timeSlots.map(t=><th key={t} style={{border:"1px solid #ccc",padding:4}}>{t}</th>)}
                </tr>
              </thead>
              <tbody>
                {sheet.sections ? sheet.sections.map(sec => (
                  <React.Fragment key={sec.name}>
                    <tr><td colSpan={4+timeSlots.length} style={{background:"#e8f0fe",fontWeight:700,fontSize:12,padding:"6px 8px",border:"1px solid #ccc",color:"#1a56db"}}>{sec.name}</td></tr>
                    {sec.parameters.map(p => (
                      <tr key={p.tag}>
                        <td style={{border:"1px solid #ccc",padding:3,fontFamily:"monospace",fontSize:10}}>{p.tag}</td>
                        <td style={{border:"1px solid #ccc",padding:3,fontSize:10}}>{p.desc}</td>
                        <td style={{border:"1px solid #ccc",padding:3,textAlign:"center"}}>{p.unit}</td>
                        <td style={{border:"1px solid #ccc",padding:3,textAlign:"center"}}>{rangeStr(p)}</td>
                        {timeSlots.map(slot => {
                          const key = `${p.tag}__${slot}`;
                          const val = entry.values?.[key] || "";
                          const oor = isOutOfRange(val, p);
                          const note = entry.notes?.[key];
                          const meta = entry.valueMeta?.[key];
                          return (
                            <td key={slot} style={{border:"1px solid #ccc",padding:3,textAlign:"center",background:oor?"#fde8e8":"transparent",color:oor?"#c62828":"#111"}}>
                              {val}
                              {meta && val && <div style={{fontSize:7,color:"#888"}}>{meta.by.split(" ")[0]} {new Date(meta.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>}
                              {note && <div style={{fontSize:8,color:"#555",fontStyle:"italic"}}>({note})</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </React.Fragment>
                )) : params.map(p => (
                  <tr key={p.tag}>
                    <td style={{border:"1px solid #ccc",padding:3,fontFamily:"monospace",fontSize:10}}>{p.tag}</td>
                    <td style={{border:"1px solid #ccc",padding:3,fontSize:10}}>{p.desc}</td>
                    <td style={{border:"1px solid #ccc",padding:3,textAlign:"center"}}>{p.unit}</td>
                    <td style={{border:"1px solid #ccc",padding:3,textAlign:"center"}}>{rangeStr(p)}</td>
                    {timeSlots.map(slot => {
                      const key = `${p.tag}__${slot}`;
                      const val = entry.values?.[key] || "";
                      const oor = isOutOfRange(val, p);
                      const note = entry.notes?.[key];
                      const meta = entry.valueMeta?.[key];
                      return (
                        <td key={slot} style={{border:"1px solid #ccc",padding:3,textAlign:"center",background:oor?"#fde8e8":"transparent",color:oor?"#c62828":"#111"}}>
                          {val}
                          {meta && val && <div style={{fontSize:7,color:"#888"}}>{meta.by.split(" ")[0]} {new Date(meta.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>}
                          {note && <div style={{fontSize:8,color:"#555",fontStyle:"italic"}}>({note})</div>}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          )}

          {/* Final Notes in PDF */}
          {entry.finalNotes && (
            <div style={{marginTop:20,padding:12,border:"1px solid #ccc",borderRadius:4}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>Final Notes / General Comments</div>
              <div style={{fontSize:12,whiteSpace:"pre-wrap",lineHeight:"1.5"}}>{entry.finalNotes}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ===================== MAIN APP =====================
function App() {
  const [badges, setBadges] = useState(INITIAL_BADGES);
  const [sheets, setSheets] = useState(ALL_SHEET_BASES);
  const [user, setUser] = useState(null);
  const [plant, setPlant] = useState(null); // "PP" or "HDPE"
  const [isAdmin, setIsAdmin] = useState(false);
  const [showAdminPin, setShowAdminPin] = useState(false);
  const [view, setView] = useState("plantSelect"); // plantSelect, login, select, form, dashboard, admin, pdf
  const [currentSheet, setCurrentSheet] = useState(null);
  const [savedEntries, setSavedEntries] = useState([]);
  const [selectedEntry, setSelectedEntry] = useState(null);
  const [storageLoaded, setStorageLoaded] = useState(false);

  // Load from persistent storage on mount
  useEffect(() => {
    (async () => {
      try {
        const badgeRes = await storageGet("socar-badges");
        if (badgeRes?.value) setBadges(JSON.parse(badgeRes.value));
      } catch(e) {}
      try {
        const entriesRes = await storageGet("socar-entries");
        if (entriesRes?.value) setSavedEntries(JSON.parse(entriesRes.value));
      } catch(e) {}
      try {
        const sheetsRes = await storageGet("socar-sheets");
        const sheetsVer = await storageGet("socar-sheets-version");
        const savedVersion = sheetsVer?.value ? parseInt(sheetsVer.value) : 0;
        if (sheetsRes?.value && savedVersion >= SHEET_VERSION) {
          setSheets(JSON.parse(sheetsRes.value));
        } else {
          // Code has newer sheet definitions — use defaults and save new version
          await storageSet("socar-sheets", JSON.stringify(ALL_SHEET_BASES));
          await storageSet("socar-sheets-version", String(SHEET_VERSION));
        }
      } catch(e) {}
      setStorageLoaded(true);
    })();
  }, []);

  // Save badges to persistent storage whenever they change
  useEffect(() => {
    if (!storageLoaded) return;
    (async () => {
      try { await storageSet("socar-badges", JSON.stringify(badges)); } catch(e) {}
    })();
  }, [badges, storageLoaded]);

  // Save entries to persistent storage whenever they change
  useEffect(() => {
    if (!storageLoaded) return;
    (async () => {
      try { await storageSet("socar-entries", JSON.stringify(savedEntries)); } catch(e) {}
    })();
  }, [savedEntries, storageLoaded]);

  // Auto-cleanup: keep only last 7 days of entries per log sheet
  useEffect(() => {
    if (!storageLoaded || savedEntries.length === 0) return;
    const today = new Date();
    const cutoff = new Date(today);
    cutoff.setDate(cutoff.getDate() - 7);
    const cutoffStr = cutoff.toISOString().split("T")[0];
    const cleaned = savedEntries.filter(e => e.date >= cutoffStr);
    if (cleaned.length < savedEntries.length) {
      setSavedEntries(cleaned);
    }
  }, [storageLoaded]);

  // Save sheets to persistent storage whenever they change
  useEffect(() => {
    if (!storageLoaded) return;
    (async () => {
      try {
        await storageSet("socar-sheets", JSON.stringify(sheets));
        await storageSet("socar-sheets-version", String(SHEET_VERSION));
      } catch(e) {}
    })();
  }, [sheets, storageLoaded]);

  const handleLogin = (operator) => { setUser(operator); setView("select"); };
  const handleLogout = () => { setUser(null); setView("plantSelect"); setIsAdmin(false); setPlant(null); };
  const handleSelectPlant = (p) => { setPlant(p); setView("login"); };
  const handleSelectSheet = (sheetBase) => { setCurrentSheet(sheetBase); setView("form"); };
  const handleSaveEntry = (entry) => {
    setSavedEntries(prev => {
      // Find existing entry with same sheet + date + shift to overwrite
      const existingIdx = prev.findIndex(e =>
        e.sheetName === entry.sheetName && e.date === entry.date && e.shift === entry.shift
      );
      if (existingIdx !== -1) {
        // Merge: keep existing values, overlay new values on top
        const existing = prev[existingIdx];
        const mergedValues = {...existing.values, ...entry.values};
        const mergedValueMeta = {...existing.valueMeta, ...entry.valueMeta};
        const mergedNotes = {...existing.notes, ...entry.notes};
        const mergedHeaderValues = {...existing.headerValues, ...entry.headerValues};
        // Remove keys where value was cleared (empty string)
        Object.keys(mergedValues).forEach(k => {
          if (mergedValues[k] === "") delete mergedValues[k];
        });
        const updated = {
          ...existing,
          ...entry,
          values: mergedValues,
          valueMeta: mergedValueMeta,
          notes: mergedNotes,
          headerValues: mergedHeaderValues,
          savedAt: new Date().toISOString(),
        };
        const newArr = [...prev];
        newArr[existingIdx] = updated;
        return newArr;
      }
      return [...prev, entry];
    });
  };

  // Loading screen while storage loads
  if (!storageLoaded) {
    return (
      <div style={{...S.app,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:22,fontWeight:700,color:COLORS.white,marginBottom:8}}>SOCAR Polymer</div>
          <div style={{fontSize:13,color:COLORS.textDim}}>Loading saved data...</div>
        </div>
      </div>
    );
  }

  if (view === "plantSelect") {
    return (
      <div style={S.app}>
        <PlantSelection onSelect={handleSelectPlant} />
      </div>
    );
  }

  if (view === "login") {
    return (
      <div style={S.app}>
        <LoginScreen
          badges={badges}
          plant={plant}
          onLogin={handleLogin}
          onAdmin={() => setShowAdminPin(true)}
        />
        {showAdminPin && (
          <AdminPinModal
            onClose={() => setShowAdminPin(false)}
            onSuccess={() => { setShowAdminPin(false); setIsAdmin(true); setView("admin"); }}
          />
        )}
      </div>
    );
  }

  if (view === "admin") {
    return (
      <div style={S.app}>
        <AdminPanel
          badges={badges}
          setBadges={setBadges}
          savedEntries={savedEntries}
          setSavedEntries={setSavedEntries}
          sheets={sheets}
          setSheets={setSheets}
          onBack={() => { setIsAdmin(false); setView("plantSelect"); setPlant(null); }}
        />
      </div>
    );
  }

  if (view === "form" && currentSheet) {
    return (
      <div style={S.app}>
        <LogSheetForm
          sheetBase={currentSheet}
          operator={user}
          savedEntries={savedEntries}
          onSave={handleSaveEntry}
          onBack={() => setView("select")}
          isAdmin={isAdmin}
        />
      </div>
    );
  }

  if (view === "dashboard") {
    return (
      <div style={S.app}>
        <Dashboard
          savedEntries={savedEntries.filter(e => {
            const sb = sheets.find(s=>s.name===e.sheetName);
            return !sb || !sb.plant || sb.plant === plant;
          })}
          operator={user}
          sheets={sheets.filter(s => !s.plant || s.plant === plant)}
          onSelectEntry={(entry) => { setSelectedEntry(entry); setView("pdf"); }}
          onExportPDF={(entry) => { setSelectedEntry(entry); setView("pdf"); }}
          onBack={() => setView("select")}
        />
      </div>
    );
  }

  if (view === "pdf" && selectedEntry) {
    return (
      <div style={S.app}>
        <PDFPreview
          entry={selectedEntry}
          sheets={sheets}
          onBack={() => setView("dashboard")}
        />
      </div>
    );
  }

  return (
    <div style={S.app}>
      <SheetSelector
        operator={user}
        sheets={sheets.filter(s => !s.plant || s.plant === plant)}
        plant={plant}
        onSelect={handleSelectSheet}
        onDashboard={() => setView("dashboard")}
        onLogout={handleLogout}
      />
    </div>
  );
}

// Render the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
